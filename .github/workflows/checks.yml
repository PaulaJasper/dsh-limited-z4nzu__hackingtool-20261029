name: checks
# The gate. Runs the exact same script as the local pre-push hook, so a green
# push means a green CI. Runs on every branch + PR (not just master).
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v5
      - run: ./scripts/check.sh
